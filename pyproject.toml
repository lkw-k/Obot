[project]
name = "obot"
version = "0.1.0"
description = "Drop JSON / JSONL / CSV files into data/ and get a RAG chatbot per file over HTTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flagembedding>=1.4.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "torch>=2.14.1",
    "typer>=0.27.2",
]

# torch is listed directly so tool.uv.sources can pin it to the CPU index;
# the default PyPI wheel on Linux bundles CUDA and makes CI installs several GB.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
obot = "obot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obot"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
